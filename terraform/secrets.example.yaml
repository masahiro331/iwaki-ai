# Plaintext layout for secrets.enc.yaml. Copy to secrets.yaml, fill
# in real values, then encrypt it with SOPS:
#
#   sops --encrypt secrets.yaml > secrets.enc.yaml
#   rm secrets.yaml
#
# After that the operator only ever edits the encrypted file via:
#   sops secrets.enc.yaml
#
# Decryption is automatic on `terraform apply` as long as the
# operator's age private key is at ~/.config/sops/age/keys.txt or
# SOPS_AGE_KEY_FILE points at it.
#
# OCI authentication is NOT here: Terraform reads ~/.oci/config
# directly (var.oci_config_profile picks the profile).

discord:
  bot_token: ""
  guild_id: ""

gemini:
  api_key: ""
